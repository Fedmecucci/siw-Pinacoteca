<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Modifica Opera</title>
<link rel="stylesheet" href="/css/opera.css">
</head>
<body>

<header>

	
		<div class="header-links">
		    <a href="/">Home</a>
            <a href="/logout">Logout</a>
        </div>
	
	</header>

<h1>Modifica Opera</h1>
	<main>
	<div class="opera-info">
	<form th:action="@{/admin/formModificaOpera}" method="POST" >
	<input type="hidden" name="id" th:value="${opera.id}" />
  		
		<div class="info-item">
		<label>
			 <span><a>Titolo:</a> <span><input type="text" name="nuovoTitolo" placeholder="Nuovo titolo" th:value="${opera.titolo}" /></span>
		   
		   
		    
		</label>
</div><div class="info-item">
		<label>
			<a>Anno:</a> <span><input type="text" name="nuovoAnno" placeholder="Nuovo anno" th:value="${opera.anno}" /></span>

		    </span>
		    
		    </span>
		</label></div>
<div class="info-item">
		<label>
			<a>Tecnica:</a> <span><input type="text" name="nuovaTecnica" placeholder="Nuova tecnica" th:value="${opera.tecnica}" /></span>
		    
		    </label>
			</div>
		</label>
		<div class="info-item"><label>
			<a>Collocazione:</a> <span><input type="text" name="nuovaCollocazione" placeholder="Nuova collocazione" th:value="${opera.collocazione}" /></span>
		    
		    </div>
		
		    
			
		</label></div><div class="info-item">
		<label>
			<span><button type="submit">Conferma</button></span>
		</label></div>
	</form>
	</div>
	</main>
</body>
</html>
